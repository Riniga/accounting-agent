# Synthetic example organisation with vouchers of several lines (MVP-005). Not a real
# organisation (ADR-003). Its books are `books/lines`: salaries and invoices.
organisation: example

features:
  accounting: true
  payroll: false
  gmail: false
  discord: false

books:
  path: ../books/lines
  format: front-matter
  fiscal_year: 2026
  bank_account: "1930"

bank:
  export_format: nordea-csv
  statement_file: statement.csv

checks:
  documents: documents

conventions:
  guessed_posting_marker: Gissad kontering
