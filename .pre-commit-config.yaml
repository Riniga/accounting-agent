# Local pre-commit hooks. Install once: `pre-commit install`.
#
# Ruff is the formatter and linter — keep the `rev` below on the SAME version as
# `ruff==...` in requirements.in and the CI Ruff job; they must move together.
#
# Scope: Python format + lint, cheap file validators, and detect-secrets (the pre-commit
# layer of methodology C4 SKA 1 / F2 SKA 5-6, next to the CI secret scan and GitHub's own
# secret scanning / push protection). See docs/development/secrets-rotation.md.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
