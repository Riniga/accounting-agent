# Package metadata and the single home for shared tool configuration. The repository
# root is the one installable package, `accounting-agent` (ADR-002).
#
# Ruff is the designated formatter and linter for the workspace — development
# methodology B2. Record this (and any deviation) as a project decision in
# docs/methodology-compliance/interpretations.md, and as an ADR if it's a significant
# choice — see docs/architecture/decisions/README.md.

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-agent"
dynamic = ["version"]
description = "Shared, organisation-agnostic core for AI-assisted bookkeeping in small non-profit organisations."
readme = "README.md"
requires-python = ">=3.14"
license = "PolyForm-Noncommercial-1.0.0" # ADR-005
authors = [{ name = "Rickard Nisses-Gagnér" }]
# Runtime dependencies only; development tools live in requirements.in / environment.yml.
dependencies = [
    "pyyaml>=6.0.3,<7", # organisation.yaml; the standard library has no YAML parser
]

[project.scripts]
accounting-agent = "accounting_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "accounting_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]
# Ruff also formats Python code blocks inside Markdown/reST by default. Excluding
# *.md/*.rst keeps the formatting gate to real Python sources — docs churn and historical
# plan files stay untouched. Revisit if you want Markdown code blocks formatted too.
extend-exclude = ["*.md", "*.rst", "*.egg-info", "build", "dist"]

[tool.ruff.lint]
# E4/E7/E9 (not E5): the Ruff formatter owns line length, so E501 is not linted — Ruff's
# own recommendation when the formatter is used. Deliberately small starter set ("accept
# defaults with minimal deviation", B2 BÖR 1); widen once the codebase is clean against it.
#   E4/E7/E9  pycodestyle (imports / statements / runtime)   F  pyflakes
#   W  pycodestyle warnings   I  isort   UP  pyupgrade   B  flake8-bugbear
#   C4  flake8-comprehensions   C90  mccabe complexity
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4", "C90"]
# Example of a deliberate, documented rule deviation — remove if you don't need it.
# ignore = ["UP042"]  # str+Enum -> StrEnum: only if you rely on (str, Enum)'s repr today.

[tool.ruff.lint.per-file-ignores]
# __init__.py files deliberately re-export a public API.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
# PR-blocking cyclomatic-complexity value — record the chosen threshold and its rationale
# in docs/methodology-compliance/interpretations.md. The advisory value is documented in
# docs/standards/coding.md, not gated here. Cognitive complexity is advisory-only until a
# clean Ruff (or other) tool supports it.
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["accounting_agent"]

[tool.ruff.format]
# Ruff defaults: double quotes, 4-space indent, magic trailing comma.
# line-ending = "lf" to match .gitattributes (*.py text eol=lf) and .editorconfig.
line-ending = "lf"

# Coverage floor, enforced as a ratchet (methodology D1 SKA 2). Set the floor just below a
# real, measured baseline (`pytest-cov`) — never a placeholder guess — and record the
# measurement + reasoning in docs/methodology-compliance/interpretations.md. It may only
# ever be raised, and only in a deliberate PR that records the new floor and updates that
# doc — never lowered to make a failing build pass.
[tool.coverage.run]
source = ["accounting_agent"]

[tool.coverage.report]
fail_under = 90 # measured baseline 96.47 % (2026-09-25) — see interpretations.md §1
skip_covered = true
