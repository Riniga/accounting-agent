version: 2

updates:
  # Python dependencies. Watches requirements.in (the source ranges) — Dependabot's pip
  # ecosystem support understands pip-compile's requirements.in/requirements-lock.txt pair
  # and opens PRs that update both together.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request a week for all of them. `main` requires a branch to be up to date,
    # so with a pull request per package every merge made the others stale, and each had
    # to be updated and re-run in turn. Security updates still come one by one.
    groups:
      python:
        patterns:
          - "*"

  # The workflow files under .github/workflows/ pin third-party Actions (actions/checkout,
  # azure/login, ...) — also a dependency supply chain, in scope for C2 (SKA 5).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
