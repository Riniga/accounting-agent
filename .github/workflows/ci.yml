name: CI

# Quality gates for every pull request to main (methodology E2), and for main itself so it
# stays verifiably green. There is no CD.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

env:
  # Keep in sync with environment.yml and `requires-python` in pyproject.toml.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Keep this version in sync with `ruff==...` in requirements.in and the `rev` in
      # .pre-commit-config.yaml.
      - name: Install Ruff
        run: python -m pip install ruff==0.16.9

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check --output-format=github .

  dependencies:
    name: Dependencies
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-tools, pip-licenses and pip-audit
        run: python -m pip install pip-tools pip-licenses pip-audit

      # Lockfile-drift check (methodology C2 SKA 3): requirements-lock.txt must be exactly
      # what requirements.in compiles to today, on Linux. Recompiles in place and diffs
      # against git. --no-header avoids spurious diffs in pip-compile's header comment. If
      # this fails after a local Windows compile, trust this diff: a platform-conditional
      # transitive package is the usual cause — pin it unconditionally in requirements.in.
      - name: Check requirements-lock.txt is up to date
        run: |
          pip-compile --generate-hashes --no-annotate --no-header --output-file=requirements-lock.txt requirements.in
          git diff --exit-code requirements-lock.txt

      # Known-vulnerability check (methodology C2 SKA 2) on the pull request, before merge.
      # Dependabot alerts cover the default branch after merge; this covers the PR itself.
      - name: Vulnerability scan
        run: pip-audit --require-hashes --disable-pip -r requirements-lock.txt

      # Licence scan (methodology C2 SKA 4) in a separate virtual environment holding only
      # the locked dependencies, so the scanning tools themselves are not scanned. The
      # allowlist lives in docs/standards/dependencies.md — keep the two in sync; this step
      # is the enforcement copy.
      - name: Install locked dependencies for licence scan
        run: |
          python -m venv /tmp/locked
          /tmp/locked/bin/pip install --require-hashes -r requirements-lock.txt

      - name: Licence scan
        run: |
          pip-licenses --python /tmp/locked/bin/python --allow-only \
            "Apache Software License;Apache-2.0;Apache Software License; BSD License;Apache Software License; MIT License;Apache-2.0 OR BSD-2-Clause;BSD License;BSD-2-Clause;BSD-3-Clause;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;MIT;MIT License;MPL-2.0 AND MIT;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License" \
            --ignore-packages accounting-agent pip setuptools

  # SAST (methodology C1 SKA 2). Semgrep was chosen over CodeQL after both ran against
  # deliberately insecure code (MVP-001 plan, step 4.2) — see
  # docs/methodology-compliance/interpretations.md §2. A genuine false positive gets a
  # documented `# nosemgrep` suppression at the call site, not a disabled rule.
  sast:
    name: SAST
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Semgrep
        run: python -m pip install semgrep

      # Scoped to our own code (C1 is about own code; supply chain is C2's territory).
      - name: Semgrep scan
        run: semgrep scan --config=p/security-audit --config=p/owasp-top-ten --error src

  secret-scan:
    name: Secret scan
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install detect-secrets
        run: python -m pip install detect-secrets==1.5.0

      # Named, blocking check (methodology C4 SKA 1, F2 SKA 5-6), next to GitHub's own secret
      # scanning and push protection. Compares against .secrets.baseline, which stores
      # forward-slash paths so this Linux runner matches it.
      - name: Secret scan
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  instruction-file-scan:
    name: Instruction file scan
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Methodology F3 SKA 8: instruction files are scanned for suspicious/hidden Unicode — a
      # known prompt-injection hiding technique.
      - name: Scan instruction files for hidden characters
        run: python scripts/scan_instruction_files.py AGENTS.md CLAUDE.md .github/copilot-instructions.md

  test:
    name: Run tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Bump CACHE_NUMBER to force a cache reset if it ever goes stale.
      - name: Cache Conda packages
        uses: actions/cache@v6.1.0
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml', 'requirements-lock.txt') }}

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          environment-file: environment.yml
          activate-environment: accounting-agent
          auto-activate: false
          use-only-tar-bz2: true

      - name: Install accounting-agent
        shell: bash -el {0}
        run: pip install -e .

      # Quarantined tests still run (visible in the log) but the coverage gate and the
      # job's exit code ignore them (methodology D1 SKA 3, docs/standards/testing.md). The
      # coverage floor lives in pyproject.toml ([tool.coverage.report] fail_under).
      - name: Run tests (quarantined, non-blocking)
        shell: bash -el {0}
        run: pytest -v -m quarantine || true

      - name: Run tests
        shell: bash -el {0}
        run: pytest -v -m "not quarantine" --cov --cov-report=term-missing
