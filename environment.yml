name: accounting-agent
channels:
  - conda-forge
dependencies:
  # Python comes from Conda; everything else is pip-installed from the hash-pinned lock.
  # Python 3.14 per the MVP-001 investigation (docs/plans/MVP-001-walking-skeleton.plan.md §0).
  - python=3.14
  - pip
  - pip:
      # Hash-pinned lock of every pip dependency (methodology C2 SKA 3). Source ranges live
      # in requirements.in; regenerate with
      #   pip-compile --generate-hashes --no-annotate --no-header requirements.in
      # after editing it. Do not add packages directly here — see
      # docs/standards/dependencies.md.
      - -r requirements-lock.txt
